<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 반 마피아</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0B0E1C; --night2:#171C36; --blood:#E5322D; --blood2:#8E1A17;
    --moon:#F5E6B8; --day:#FBE7B6; --day2:#F6D48A; --ink:#1C1A2E; --sun:#F0842A;
    --police:#3B7BFF; --doctor:#35C27A; --citizen:#C9B98A;
    --fg:var(--moon); --bg:var(--night); --bg2:var(--night2); --accent:var(--blood);
    --tile:rgba(245,230,184,.08); --tile-border:rgba(245,230,184,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--fg);
    transition:background .9s ease,color .9s ease;
    overflow:hidden; -webkit-user-select:none; user-select:none;
  }
  body.day{
    --fg:var(--ink); --bg:var(--day); --bg2:var(--day2); --accent:var(--sun);
    --tile:rgba(28,26,46,.06); --tile-border:rgba(28,26,46,.25);
  }
  body.day .sky{background:radial-gradient(circle at 80% 15%, #FFF3C4 0, #FFD979 12%, transparent 32%), linear-gradient(180deg,#FFF3D2 0%,var(--day) 60%)}
  .sky{position:fixed;inset:0;z-index:0;transition:opacity .9s;
    background:radial-gradient(circle at 82% 18%, rgba(245,230,184,.55) 0, rgba(245,230,184,.12) 6%, transparent 18%),
               radial-gradient(ellipse at 50% 120%, var(--night2) 0, var(--night) 60%)}
  .vignette{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(229,50,45,.55) 100%);
    transition:opacity .6s}
  body.night.pulse .vignette{animation:beat 1.15s ease-in-out infinite}
  @keyframes beat{0%,100%{opacity:.15}12%{opacity:.6}25%{opacity:.2}38%{opacity:.5}60%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){body.night.pulse .vignette{animation:none;opacity:.3}}

  #app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;font-weight:500;font-size:clamp(14px,1.6vw,20px);gap:16px}
  .topbar .round{font-family:'Black Han Sans',sans-serif;font-size:clamp(20px,2.6vw,32px);letter-spacing:.02em}
  .topbar .counts{display:flex;gap:18px;opacity:.85}
  .topbar .counts b{font-family:'Black Han Sans',sans-serif;font-size:1.25em}
  .iconbtn{background:var(--tile);border:1px solid var(--tile-border);color:var(--fg);border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-size:.9em}
  .iconbtn:hover{background:var(--tile-border)}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;text-align:center;padding:12px 24px;gap:18px;min-height:0;overflow:auto}
  .display{font-family:'Black Han Sans',sans-serif;font-size:clamp(40px,7.5vw,112px);line-height:1.05;letter-spacing:.01em;text-wrap:balance}
  .display.small{font-size:clamp(30px,5vw,72px)}
  .display.huge{font-size:clamp(60px,12vw,190px)}
  .display.red{color:var(--blood)}
  .sub{font-size:clamp(16px,2.2vw,30px);line-height:1.5;max-width:26em;opacity:.9;text-wrap:balance}
  .sub strong{font-weight:700}
  .hint{font-size:clamp(13px,1.4vw,17px);opacity:.6;max-width:36em;line-height:1.55}

  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:16px 24px 26px}
  .btn{font:inherit;font-weight:700;font-size:clamp(17px,2vw,26px);padding:.7em 1.6em;border-radius:14px;cursor:pointer;border:2px solid transparent;transition:transform .08s,background .2s;min-width:9em}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);color:#fff}
  body.day .btn.primary{color:#fff}
  .btn.ghost{background:transparent;border-color:var(--tile-border);color:var(--fg)}
  .btn.ghost:hover{background:var(--tile)}
  .btn.danger{background:var(--blood);color:#fff}
  .btn.success{background:var(--doctor);color:#fff}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.big{font-size:clamp(22px,2.8vw,36px);padding:.8em 2em;min-width:11em}
  .btn:focus-visible,.tile:focus-visible,.iconbtn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

  /* number tiles */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;width:min(920px,100%);margin:0 auto}
  .grid.compact{grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;width:min(760px,100%)}
  .grid.compact .tile{font-size:clamp(18px,2vw,26px);border-radius:10px}
  .tile{aspect-ratio:1;border-radius:14px;border:2px solid var(--tile-border);background:var(--tile);color:var(--fg);
    font-family:'Black Han Sans',sans-serif;font-size:clamp(22px,2.6vw,34px);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .08s,background .15s}
  .tile:hover{background:var(--tile-border)}
  .tile:active{transform:scale(.94)}
  .tile.sel{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.06)}
  .tile.dead{opacity:.28;cursor:default;text-decoration:line-through;text-decoration-thickness:4px}
  .tile.dead:hover{background:var(--tile)}
  .tile .badge{position:absolute;bottom:-6px;right:-6px;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;padding:2px 6px;border-radius:999px;color:#fff}

  /* forms */
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 22px;width:min(860px,100%);text-align:left}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:clamp(13px,1.3vw,16px);opacity:.8}
  .field input,.field select,.field textarea{font:inherit;font-size:clamp(18px,2vw,26px);padding:.4em .7em;border-radius:10px;border:2px solid var(--tile-border);background:var(--tile);color:var(--fg);width:100%}
  .field input[type=number]{font-family:'Black Han Sans',sans-serif;letter-spacing:.05em}
  .field textarea{font-size:clamp(14px,1.4vw,17px);min-height:6.5em;resize:vertical;line-height:1.5}
  .field.wide{grid-column:1/-1}
  .check{display:flex;align-items:center;gap:10px;font-size:clamp(14px,1.5vw,18px);cursor:pointer}
  .check input{width:22px;height:22px;accent-color:var(--accent)}
  .error{color:var(--blood);font-weight:700}
  body.day .error{color:#B3241F}

  .code{font-family:'Black Han Sans',sans-serif;font-size:clamp(44px,9.5vw,140px);letter-spacing:.14em;padding:.1em .3em 0 .35em;border:3px dashed var(--tile-border);border-radius:24px;line-height:1.1}
  .codeinput{font-family:'Black Han Sans',sans-serif;font-size:clamp(32px,6.6vw,100px);letter-spacing:.16em;text-align:center;text-transform:uppercase;width:min(8.6em,92vw);padding:.15em .2em 0 .3em;border-radius:20px;border:3px solid var(--tile-border);background:var(--tile);color:var(--fg)}

  /* role card */
  .card{width:min(520px,92vw);border-radius:28px;padding:40px 30px;border:3px solid var(--tile-border);background:var(--tile);display:flex;flex-direction:column;align-items:center;gap:14px;min-height:340px;justify-content:center;transition:background .2s}
  .card .rolename{font-family:'Black Han Sans',sans-serif;font-size:clamp(56px,11vw,120px);line-height:1}
  .card .roledesc{font-size:clamp(15px,2vw,20px);line-height:1.55;opacity:.9}
  .card.mafia{background:linear-gradient(160deg,#3A0E0E,#12060A);border-color:var(--blood);color:#FFE3DF}
  .card.mafia .rolename{color:var(--blood)}
  .card.police{background:linear-gradient(160deg,#0F2557,#0A1330);border-color:var(--police);color:#DCE8FF}
  .card.police .rolename{color:#7FA8FF}
  .card.doctor{background:linear-gradient(160deg,#0E3A28,#071A13);border-color:var(--doctor);color:#D9FFE9}
  .card.doctor .rolename{color:#5EE29B}
  .card.citizen{background:linear-gradient(160deg,#3E361F,#1C180C);border-color:var(--citizen);color:#F7EDD2}
  .card.citizen .rolename{color:var(--citizen)}
  .card.hidden-card{cursor:pointer}
  .card.hidden-card .rolename{font-size:clamp(28px,5vw,48px);opacity:.7}
  .mates{font-weight:700;font-size:clamp(16px,2.2vw,22px);padding:6px 14px;border-radius:10px;background:rgba(0,0,0,.35)}

  .mission{border:3px solid var(--blood);border-radius:20px;padding:12px 24px;background:rgba(229,50,45,.12);max-width:34em}
  .mission .mlabel{font-size:clamp(13px,1.4vw,16px);color:var(--blood);font-weight:700;margin-bottom:6px}
  .mission .mtext{font-family:'Black Han Sans',sans-serif;font-size:clamp(24px,3.4vw,46px);line-height:1.15}

  .timer{font-family:'Black Han Sans',sans-serif;font-size:clamp(90px,20vw,280px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .timer.warn{color:var(--blood);animation:tick .5s ease-in-out infinite alternate}
  @keyframes tick{from{transform:scale(1)}to{transform:scale(1.06)}}
  @media (prefers-reduced-motion:reduce){.timer.warn{animation:none}}

  .reveal{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.reveal{animation:none}}
  .shake{animation:shake .5s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

  .home-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;width:min(760px,100%)}
  .choice{border:2px solid var(--tile-border);background:var(--tile);color:var(--fg);border-radius:24px;padding:34px 24px;cursor:pointer;text-align:center;font:inherit;transition:background .2s,transform .08s}
  .choice:hover{background:var(--tile-border)}
  .choice:active{transform:scale(.98)}
  .choice .ct{font-family:'Black Han Sans',sans-serif;font-size:clamp(28px,4vw,44px);margin-bottom:8px}
  .choice .cd{font-size:clamp(14px,1.5vw,17px);opacity:.75;line-height:1.5}

  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:min(920px,100%);text-align:left}
  .roster div{padding:8px 12px;border-radius:10px;background:var(--tile);border:1px solid var(--tile-border);font-size:clamp(14px,1.5vw,18px)}
  .roster div.dead{opacity:.45;text-decoration:line-through}
  .roster div.mafia{border-color:var(--blood)}
  .rolechip{font-family:'Black Han Sans',sans-serif;margin-left:8px}
  .mafia-text{color:var(--blood)} .police-text{color:var(--police)} .doctor-text{color:var(--doctor)} .citizen-text{opacity:.7}
  body.day .police-text{color:#1F55C9} body.day .doctor-text{color:#1E8A54}

  .private{border:2px dashed var(--tile-border);border-radius:16px;padding:10px 18px;font-size:clamp(13px,1.4vw,16px);opacity:.75;max-width:40em;line-height:1.5}
  .pill{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--tile);border:1px solid var(--tile-border);font-size:.85em;margin:2px}
</style>
</head>
<body class="night">
<div class="sky"></div>
<div class="vignette"></div>
<div id="app"></div>

<script>
/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const ROLE = { mafia:{ko:'마피아',cls:'mafia'}, police:{ko:'경찰',cls:'police'}, doctor:{ko:'의사',cls:'doctor'}, citizen:{ko:'시민',cls:'citizen'} };
const ROLE_DESC = {
  mafia:'밤마다 동료와 함께 한 명을 지목해 없앱니다. 낮에는 시민인 척 연기하세요. 밤에 화면에 뜨는 비밀 미션을 낮 동안 몰래 수행해야 합니다. 들키면 힌트가 공개됩니다!',
  police:'밤마다 한 명을 골라 마피아인지 확인할 수 있습니다. 결과는 화면으로 몰래 알려드립니다. 낮에 정보를 어떻게 쓸지는 당신의 몫!',
  doctor:'밤마다 한 명을 골라 치료합니다. 그 사람이 마피아에게 지목되면 살아남습니다. 자기 자신도 치료할 수 있어요.',
  citizen:'특별한 능력은 없지만 가장 중요한 역할입니다. 낮 토론에서 마피아를 찾아내고 투표로 몰아내세요.'
};
const DEFAULT_MISSIONS = [
  '토론 중 손뼉을 한 번 치기',
  '"그런데"로 말을 시작하기',
  '다른 사람이 말할 때 크게 고개 끄덕이기',
  '토론 중 한 번 소리 내어 웃기',
  '손을 들고 발언하기',
  '"솔직히"라는 말을 쓰기',
  '팔짱을 낀 채로 10초 있기',
  '누군가의 이름을 두 번 연달아 부르기',
  '토론 중 자리에서 한 번 일어났다 앉기',
  '"음…" 하고 고민하는 척하기',
  '"저는 시민이에요"라고 말하기',
  '턱을 괴고 발언하기'
];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function assignRoles(cfg,seed){
  const arr=[];
  for(let i=0;i<cfg.m;i++)arr.push('mafia');
  for(let i=0;i<cfg.p;i++)arr.push('police');
  for(let i=0;i<cfg.d;i++)arr.push('doctor');
  while(arr.length<cfg.n)arr.push('citizen');
  const rng=mulberry32(seed*7919+13);
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  return arr;
}
function validateCfg(c){
  if(!c||![c.n,c.m,c.p,c.d,c.r].every(Number.isInteger))return '설정 값이 올바르지 않아요.';
  if(c.n<4||c.n>40)return '학급 인원은 4~40명이어야 해요.';
  if(c.m<1||c.m>9)return '마피아는 1~9명이어야 해요.';
  if(c.p<0||c.p>9||c.d<0||c.d>9)return '경찰과 의사는 0~9명이어야 해요.';
  if(c.m+c.p+c.d>=c.n)return '시민이 최소 1명은 있어야 해요. 인원을 조정하세요.';
  if(c.m*2>=c.n)return '마피아가 너무 많아요. 전체의 절반 미만으로 하세요.';
  if(c.r<1||c.r>9)return '라운드는 1~9 사이로 정하세요.';
  return null;
}

/* ---- 코드 인코딩: 사람이 옮겨 적어도 안전하도록 설계 ----
   - 0/O, 1/I/L, U 처럼 헷갈리는 문자를 아예 뺀 32자 알파벳(Crockford 방식) 사용
   - 데이터 6자 + 체크섬 1자 = 총 7자. 오타가 나면 형식이 아니라 "체크섬 불일치"로 명확히 걸러짐
   - 디코딩 뒤에도 설정 화면과 100% 동일한 validateCfg()로 다시 검증해 규칙 이탈을 원천 차단 */
const CODE_ALPHA='0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // I,L,O,U 없음
const CODE_DATA_LEN=6;
const SEED_RANGE=2000; // cfg 최대값(409999) * 2000 < 32^6, 6자리 안에 항상 들어감을 보장
function b32Encode(num,len){
  let s='',v=Math.max(0,Math.floor(num));
  for(let i=0;i<len;i++){ s=CODE_ALPHA[v%32]+s; v=Math.floor(v/32); }
  return s;
}
function b32Decode(str){
  let v=0;
  for(const ch of str){ const idx=CODE_ALPHA.indexOf(ch); if(idx<0)return null; v=v*32+idx; }
  return v;
}
function codeChecksum(dataStr){
  let sum=0;
  for(let i=0;i<dataStr.length;i++){ const idx=CODE_ALPHA.indexOf(dataStr[i]); if(idx<0)return null; sum+=(idx+1)*(i+1); }
  return CODE_ALPHA[sum%32];
}
function normalizeCode(raw){
  return (raw||'').trim().toUpperCase().replace(/[^0-9A-Z]/g,'')
    .replace(/O/g,'0').replace(/[IL]/g,'1').replace(/U/g,'V'); // 혹시 남아있을 헷갈림 문자 방어적으로 보정
}
function encodeCode(cfg,seed){
  const cfgPart=((((cfg.n*10+cfg.m)*10+cfg.p)*10+cfg.d)*10+cfg.r);
  const v=cfgPart*SEED_RANGE+(seed%SEED_RANGE);
  const data=b32Encode(v,CODE_DATA_LEN);
  return data+codeChecksum(data);
}
function decodeCode(raw){
  const code=normalizeCode(raw);
  if(code.length!==CODE_DATA_LEN+1)return {error:'length'};
  const data=code.slice(0,CODE_DATA_LEN), given=code.slice(CODE_DATA_LEN);
  const expect=codeChecksum(data);
  if(expect===null)return {error:'chars'};
  if(given!==expect)return {error:'checksum'};
  let v=b32Decode(data); if(v===null)return {error:'chars'};
  const seed=v%SEED_RANGE; v=Math.floor(v/SEED_RANGE);
  const r=v%10; v=Math.floor(v/10);
  const d=v%10; v=Math.floor(v/10);
  const p=v%10; v=Math.floor(v/10);
  const m=v%10; v=Math.floor(v/10);
  const n=v;
  const cfg={n,m,p,d,r};
  const err=validateCfg(cfg);
  if(err)return {error:'range'};
  return {cfg,seed};
}

/* ---------- sound (Web Audio, no files) ---------- */
const Sound={
  on:true, ctx:null, beatTimer:null,
  ac(){ if(!this.ctx){ try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){this.on=false} } if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); return this.ctx },
  tone(f,dur,type='sine',vol=.3,when=0){ if(!this.on)return; const c=this.ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type=type;o.frequency.value=f; g.gain.setValueAtTime(0,c.currentTime+when); g.gain.linearRampToValueAtTime(vol,c.currentTime+when+.01); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+when+dur); o.connect(g).connect(c.destination); o.start(c.currentTime+when); o.stop(c.currentTime+when+dur+.05) },
  noise(dur,vol=.25,when=0){ if(!this.on)return; const c=this.ac(); if(!c)return; const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),dd=b.getChannelData(0); for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length); const s=c.createBufferSource(); s.buffer=b; const g=c.createGain(); g.gain.value=vol; const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; s.connect(f).connect(g).connect(c.destination); s.start(c.currentTime+when) },
  thump(when=0){ this.tone(55,.28,'sine',.5,when); this.tone(40,.22,'sine',.4,when+.16) },
  heartbeat(start){ clearInterval(this.beatTimer); this.beatTimer=null; document.body.classList.toggle('pulse',!!start); if(start&&!(this.bgm&&this.bgmOn)){ const go=()=>this.thump(0); go(); this.beatTimer=setInterval(go,1150) } },
  tick(){ this.tone(1400,.05,'square',.12) },
  click(){ this.tone(600,.05,'triangle',.15) },
  drumroll(sec){ if(!this.on)return; const n=Math.floor(sec/.09); for(let i=0;i<n;i++){ this.noise(.08,.15+.25*(i/n),i*.09) } },
  gong(){ this.tone(110,1.6,'sine',.5); this.tone(220,1.2,'triangle',.25,.02); this.tone(165,1.4,'sine',.3,.05); this.noise(.3,.3) },
  chime(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.5,'triangle',.25,i*.09)) },
  sting(){ [880,660,440,220].forEach((f,i)=>this.tone(f,.35,'sawtooth',.18,i*.07)); this.noise(.4,.3) },
  fanfare(){ [392,523,659,784,1046].forEach((f,i)=>this.tone(f,.6,'triangle',.3,i*.13)); this.noise(.6,.15,.6) },
  bad(){ [330,262,196,131].forEach((f,i)=>this.tone(f,.6,'sawtooth',.2,i*.18)) },

  /* ---- 배경음: 파일 없이 합성. 항상 들리도록 중음역 반복 패턴 + 지속 패드 + 바람 ---- */
  bgmOn:true, bgm:null, bgmMode:null, bgmTimer:null, bgmVol:.8,
  bgmMaster(){ const c=this.ac(); if(!c)return null; if(!this._master){ this._master=c.createGain(); this._master.gain.value=this.bgmVol; this._master.connect(c.destination) } return this._master },
  setVol(v){ this.bgmVol=v; if(this._master){ const n=this.ctx.currentTime; this._master.gain.cancelScheduledValues(n); this._master.gain.setTargetAtTime(v,n,.05) } },
  note(bus,f,when,dur,type,vol,cutoff){ const c=this.ctx; const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter(); o.type=type; o.frequency.value=f; lp.type='lowpass'; lp.frequency.setValueAtTime(cutoff,when); lp.frequency.exponentialRampToValueAtTime(Math.max(120,cutoff*.35),when+dur);
    g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(vol,when+.02); g.gain.exponentialRampToValueAtTime(.0001,when+dur); o.connect(lp).connect(g).connect(bus); o.start(when); o.stop(when+dur+.05) },
  startBgm(mode){
    if(!this.bgmOn)return; const c=this.ac(); if(!c||c.state!=='running')return;
    if(this.bgm&&this.bgmMode===mode)return;
    this.stopBgm(true); this.bgmMode=mode;
    const M=this.bgmMaster(), t=c.currentTime, nodes=[];
    const bus=c.createGain(); bus.gain.value=0; bus.connect(M); bus.gain.linearRampToValueAtTime(1,t+1.2);
    const night=mode!=='day';
    // 1) 지속 패드: 작은 스피커에서도 들리는 중음역 단조 화음 (약간 어긋난 두 겹)
    const chord=night?[220,261.6,329.6,349.2]:[293.7,349.2,440,466.2];
    chord.forEach((f,i)=>[0,1.5].forEach(det=>{ const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=det*(i%2?1:-1); lp.type='lowpass'; lp.frequency.value=night?700:1100; g.gain.value=night?.028:.022;
      const lfo=c.createOscillator(),lg=c.createGain(); lfo.frequency.value=.09+i*.04; lg.gain.value=night?350:400; lfo.connect(lg).connect(lp.frequency); lfo.start(t);
      o.connect(lp).connect(g).connect(bus); o.start(t); nodes.push(o,lfo) }));
    // 2) 저음 드론
    [[55,.14],[55.6,.1]].forEach(([f,v])=>{ const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter(); o.type='sawtooth'; o.frequency.value=night?f:f*1.335; lp.type='lowpass'; lp.frequency.value=220; g.gain.value=v; o.connect(lp).connect(g).connect(bus); o.start(t); nodes.push(o) });
    // 3) 바람
    const len=c.sampleRate*4, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const ns=c.createBufferSource(); ns.buffer=buf; ns.loop=true; const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=night?500:800; bp.Q.value=1.2;
    const ng=c.createGain(); ng.gain.value=night?.06:.03; const wl=c.createOscillator(),wg=c.createGain(); wl.frequency.value=.06; wg.gain.value=280; wl.connect(wg).connect(bp.frequency); wl.start(t);
    ns.connect(bp).connect(ng).connect(bus); ns.start(t); nodes.push(ns,wl);
    // 4) 반복 패턴 (8분음표 단위 스케줄러) — 밤: 느리고 무거운 두 음 반복, 낮: 빠른 추격 리듬
    const bpm=night?80:128, step=60/bpm/2;
    const bass=night?[110,0,110,0,116.5,0,110,0,110,0,110,0,103.8,0,116.5,0]:[146.8,146.8,0,146.8,155.6,0,146.8,0,146.8,146.8,0,146.8,138.6,0,155.6,0];
    const lead=night?[329.6,0,0,0,311.1,0,0,0,293.7,0,0,0,246.9,0,0,0]:[440,0,0,0,466.2,0,0,0,440,0,0,0,415.3,0,0,0];
    let i=0, next=t+.1; const self=this;
    this.bgmTimer=setInterval(()=>{ if(!self.bgm)return; while(next<c.currentTime+.6){ const b=bass[i%16];
        if(b)self.note(bus,b,next,night?step*1.6:step*.9,'sawtooth',night?.22:.2,night?900:1400);
        if(!night&&i%2===0)self.note(bus,3000,next,.04,'square',.05,6000);
        if(night&&i%8===0)self.thump(next-c.currentTime);
        const bar=Math.floor(i/16); const L=lead[i%16]; if(L&&bar%4===3)self.note(bus,L,next,step*3.5,'triangle',night?.09:.08,2400);
        if(night&&i%16===0&&Math.random()<.5){ const o=c.createOscillator(),g=c.createGain(); o.type='sine'; const f0=600+Math.random()*600; o.frequency.setValueAtTime(f0,next); o.frequency.exponentialRampToValueAtTime(f0*.5,next+3.5); g.gain.setValueAtTime(0,next); g.gain.linearRampToValueAtTime(.045,next+1.2); g.gain.linearRampToValueAtTime(0,next+3.6); o.connect(g).connect(bus); o.start(next); o.stop(next+3.7) }
        next+=step; i++ } },120);
    this.bgm={bus,nodes};
  },
  stopBgm(quick){
    clearInterval(this.bgmTimer); this.bgmTimer=null; const b=this.bgm; this.bgm=null; this.bgmMode=null; if(!b)return;
    const c=this.ctx, n=c.currentTime, fade=quick?.8:1.5; b.bus.gain.cancelScheduledValues(n); b.bus.gain.setValueAtTime(b.bus.gain.value,n); b.bus.gain.linearRampToValueAtTime(0,n+fade);
    setTimeout(()=>{ b.nodes.forEach(x=>{try{x.stop()}catch(e){}}); try{b.bus.disconnect()}catch(e){} },fade*1000+50);
  },
  duck(sec){ const M=this._master; if(!M||!this.bgm)return; const n=this.ctx.currentTime; M.gain.cancelScheduledValues(n); M.gain.setValueAtTime(M.gain.value,n); M.gain.linearRampToValueAtTime(this.bgmVol*.3,n+.3); M.gain.linearRampToValueAtTime(this.bgmVol,n+sec+1) },
  syncBgm(){ const mode=document.body.classList.contains('day')?'day':'night'; if(this.bgmOn)this.startBgm(mode); else this.stopBgm(false) }
};
document.addEventListener('pointerdown',()=>{ Sound.ac(); Sound.syncBgm() },{capture:true});
document.addEventListener('keydown',()=>{ Sound.ac(); Sound.syncBgm() },{capture:true});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&Sound.ctx){ Sound.ctx.resume().then(()=>Sound.syncBgm()) } });
setInterval(()=>{ if(Sound.ctx&&Sound.bgmOn){ if(Sound.ctx.state!=='running')Sound.ctx.resume().catch(()=>{}); if(Sound.ctx.state==='running'&&!Sound.bgm)Sound.syncBgm() } },2000);

function setBodyMode(mode){ document.body.classList.toggle('day',mode==='day'); document.body.classList.toggle('night',mode!=='day'); if(mode!=='night')Sound.heartbeat(false); if(Sound.ctx)Sound.syncBgm() }
function go(screen,extra){ S={screen,...(extra||{})}; render() }

/* ---------- render ---------- */
function render(){
  clearInterval(timerHandle); timerHandle=null;
  const app=$('#app');
  const fn=SCREENS[S.screen]; app.innerHTML=fn?fn():'';
  bind();
}
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{Sound.click();go(b.dataset.go)});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>ACT[b.dataset.act](b));
  document.querySelectorAll('.hold-peek').forEach(btn=>{
    const target=document.getElementById('missionText');
    if(!target)return;
    const show=e=>{ if(e)e.preventDefault(); target.style.display='block'; };
    const hide=()=>{ target.style.display='none'; };
    btn.addEventListener('pointerdown',show);
    ['pointerup','pointercancel','pointerleave','blur'].forEach(ev=>btn.addEventListener(ev,hide));
  });
}
const topbarHTML=(left,mid)=>`<div class="topbar"><div class="round">${left||''}</div><div class="counts">${mid||''}</div><span style="display:flex;gap:8px;align-items:center">${S.screen!=='home'?'<button class="iconbtn" data-act="confirmHome" title="처음 화면으로">🏠 처음으로</button>':''}<input type="range" id="vol" min="0" max="1" step="0.05" value="${Sound.bgmVol}" title="배경음 크기" style="width:90px;accent-color:var(--accent)" oninput="Sound.setVol(+this.value)"><button class="iconbtn" data-act="toggleBgm">${Sound.bgmOn?'🎵 배경음 켜짐':'🎵 배경음 꺼짐'}</button><button class="iconbtn" data-act="toggleSound">${Sound.on?'🔊 효과음':'🔇 효과음'}</button></span></div>`;

      actions=`<button class="btn primary big" data-act="next" ${G.night.mafia==null?'disabled':''}>마피아, 눈을 감으세요</button>`; break;
    case 'n_doctor':
      body=`<div class="display small" style="color:#5EE29B">의사, 눈을 뜨세요</div><div class="sub">오늘 밤 지켜줄 사람을 가리키세요. 자기 자신도 가능합니다.</div>${tilesHTML(G.night.doctor)}`;
      actions=`<button class="btn primary big" data-act="next" ${G.night.doctor==null?'disabled':''}>의사, 눈을 감으세요</button>`; break;
    case 'n_police':
      body=`<div class="display small" style="color:#7FA8FF">경찰, 눈을 뜨세요</div><div class="sub">조사할 사람을 가리키세요.</div>${tilesHTML(G.night.police)}
        ${G.night.police!=null?`<div class="display reveal ${G.roles[G.night.police]==='mafia'?'red':''}">${G.night.police+1}번은 ${G.roles[G.night.police]==='mafia'?'마피아입니다':'마피아가 아닙니다'}</div>`:''}`;
      actions=`<button class="btn primary big" data-act="next" ${G.night.police==null?'disabled':''}>경찰, 눈을 감으세요</button>`; break;
    case 'dawn':
      body=`<div class="display">아침이 밝았습니다</div><div class="sub">모두 눈을 뜨세요. 지난밤, 무슨 일이 있었을까요?</div>`;
      actions=`<button class="btn primary big" data-act="dawnReveal">결과 발표</button>`; break;
    case 'dawn_roll':
      body=`<div class="display small">지난밤에는…</div><div class="timer" id="roll">3</div>`; break;
    case 'dawn_result': {
      const v=G.lastNight;
      body=v.killed!=null
        ?`<div class="display huge red reveal">${v.killed+1}번</div><div class="display small reveal">이 사라졌습니다</div><div class="sub">${v.killed+1}번은 이제 말할 수 없습니다. 조용히 지켜보세요.</div>`
        :`<div class="display reveal" style="color:#5EE29B">아무도 죽지 않았습니다!</div><div class="sub">${v.saved?'의사가 누군가를 살려냈습니다.':'평화로운 밤이었습니다.'}</div>`;
      actions=`<button class="btn primary big" data-act="afterDawn">낮 시작</button>`; break; }
    case 'd_mission':
      body=`<div class="display small">투표 전, 마피아 미션 판정</div>
        <div class="hint">방금 토론 중에 마피아 전원이 비밀 미션을 수행했는지 선생님이 판단하세요. 화면에는 내용을 띄우지 않습니다 — 실패로 판정해야 그때 전체에 공개됩니다.</div>
        <button class="btn ghost hold-peek" id="missionBtn" type="button">🔒 미션 내용 다시 보기 (선생님만)</button>
        <div class="sub" id="missionText" style="display:none">이번 라운드 미션: <strong>${escapeHtml(G.mission||'')}</strong></div>`;
      actions=`<button class="btn success big" data-act="missionOk">성공 (조용히 투표로)</button><button class="btn danger big" data-act="missionFail">실패 (전체 공개)</button>`; break;
    case 'd_missionfail':
      body=`<div class="display red reveal shake">마피아가 미션에<br>실패했습니다!</div><div class="sub">이제 사회자가 마피아에 대한 힌트 한 가지를 드리겠습니다.</div>`;
      actions=`<button class="btn primary big" data-act="toVote">투표 시작</button>`; break;
    case 'd_discuss':
      body=`<div class="display small">토론 시간</div><div class="timer" id="clock">${fmt(G.timeLeft)}</div><div class="sub">누가 수상한가요? 근거를 들어 이야기하세요.</div>`;
      actions=`<button class="btn ghost" data-act="timerToggle" id="tbtn">${G.timerOn?'일시정지':'시작'}</button><button class="btn ghost" data-act="timerPlus">+30초</button><button class="btn primary big" data-act="toMission">토론 마치기</button>`; break;
    case 'd_vote':
      body=`<div class="display small">투표</div><div class="timer ${G.timeLeft<=5?'warn':''}" id="clock" style="font-size:clamp(50px,9vw,120px)">${fmt(G.timeLeft)}</div><div class="sub">가장 많은 표를 받은 사람 번호를 선생님이 누르세요.</div>${tilesHTML(G.voteSel)}`;
      actions=`<button class="btn ghost" data-act="timerToggle" id="tbtn">${G.timerOn?'일시정지':'시작'}</button><button class="btn ghost" data-act="noExec">처형 없음 (동률·기권)</button><button class="btn danger big" data-act="execute" ${G.voteSel==null?'disabled':''}>처형</button>`; break;
    case 'exec_roll':
      body=`<div class="display small">${G.voteSel+1}번의 운명은…</div><div class="timer" id="roll">3</div>`; break;
    case 'exec_result': {
      const i=G.lastExec; const role=G.roles[i];
      body=`<div class="display huge red reveal">${i+1}번</div><div class="display small reveal">처형되었습니다</div>
        ${c.showRole?`<div class="display reveal ${role==='mafia'?'red':''}" style="margin-top:8px">${role==='mafia'?'마피아였습니다!':`마피아가 아니었습니다… (${ROLE[role].ko})`}</div>`:''}`;
      actions=`<button class="btn primary big" data-act="afterExec">계속</button>`; break; }
    case 'no_exec':
      body=`<div class="display reveal">오늘은 아무도<br>처형되지 않았습니다</div><div class="sub">마피아는 하루를 더 얻었습니다.</div>`;
      actions=`<button class="btn primary big" data-act="afterExec">계속</button>`; break;
  }
  return `${gameTop()}<div class="stage">${body}</div><div class="actions">${actions}</div>`;
};

SCREENS.end=()=>{ const mafiaWin=G.winner==='mafia'; setBodyMode(mafiaWin?'night':'day'); return `
  ${gameTop()}
  <div class="stage">
    <div class="display huge reveal ${mafiaWin?'red':''}">${mafiaWin?'마피아 승리':'시민 승리'}</div>
    <div class="sub">${G.winReason}</div>
    ${rosterHTML(true)}
  </div>
  <div class="actions"><button class="btn ghost" data-act="again">같은 반으로 다시 하기</button><button class="btn primary" data-go="home">처음 화면으로</button></div>`};

function fmt(s){ s=Math.max(0,s|0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` }

/* ---------- actions ---------- */
function newGame(cfg,seed,extra){
  const roles=assignRoles(cfg,seed);
  const missions=(extra.missions||'').split('\n').map(x=>x.trim()).filter(Boolean);
  G={cfg:{...cfg,...extra},seed,code:encodeCode(cfg,seed),roles,alive:roles.map(()=>true),round:1,phase:'d_intro',night:{mafia:null,doctor:null,police:null},
     missions:missions.length?missions:DEFAULT_MISSIONS,missionPool:[],mission:null,started:false,lastNight:null,voteSel:null,lastExec:null,timeLeft:0,timerOn:false,winner:null,winReason:''};
}
function drawMission(){ if(!G.missionPool.length)G.missionPool=[...G.missions].sort(()=>Math.random()-.5); return G.missionPool.pop() }
function startRound(){
  G.phase='n_sleep'; G.night={mafia:null,doctor:null,police:null}; G.voteSel=null; G.mission=drawMission(); go('game');
}
function checkWin(afterDay){
  const k=counts();
  if(k.mafia===0){ G.winner='citizen'; G.winReason='마피아를 모두 찾아냈습니다. 마을에 평화가 돌아왔습니다.'; Sound.fanfare(); go('end'); return true }
  if(G.cfg.majority&&k.mafia>=k.cit){ G.winner='mafia'; G.winReason='마피아 수가 시민 수와 같거나 많아졌습니다. 마을은 마피아의 손에 넘어갔습니다.'; Sound.bad(); go('end'); return true }
  if(afterDay&&G.round>=G.cfg.r){ G.winner='mafia'; G.winReason=`${G.cfg.r}라운드 동안 마피아를 모두 잡지 못했습니다. 마피아 ${k.mafia}명이 끝까지 살아남았습니다.`; Sound.bad(); go('end'); return true }
  return false;
}
function runCountdown(from,done){
  const el=$('#roll'); let n=from; Sound.drumroll(from); Sound.duck(from+1.5);
  timerHandle=setInterval(()=>{ n--; if(n>0){ el.textContent=n; Sound.tick() } else { clearInterval(timerHandle); timerHandle=null; done() } },1000);
}
function startClock(){
  if(timerHandle)clearInterval(timerHandle);
  timerHandle=setInterval(()=>{
    if(!G.timerOn)return;
    G.timeLeft--; const el=$('#clock'); if(!el)return; el.textContent=fmt(G.timeLeft);
    if(G.timeLeft<=10&&G.timeLeft>0){ el.classList.add('warn'); Sound.tick() }
    if(G.timeLeft<=0){ G.timerOn=false; Sound.gong(); const b=$('#tbtn'); if(b)b.textContent='시간 종료'; el.textContent='0:00' }
  },1000);
}

const ACT={
  toggleSound(){ Sound.on=!Sound.on; if(!Sound.on)Sound.heartbeat(false); render() },
  toggleBgm(){ Sound.bgmOn=!Sound.bgmOn; Sound.ac(); Sound.syncBgm(); render() },
  kick(){ Sound.bgmOn=true; Sound.ac(); Sound.syncBgm(); render() },
  makeCode(){
    const c={n:+$('#f_n').value,m:+$('#f_m').value,p:+$('#f_p').value,d:+$('#f_d').value,r:+$('#f_r').value};
    const extra={disc:+$('#f_disc').value||120,vote:+$('#f_vote').value||20,showRole:$('#f_showRole').checked,majority:$('#f_majority').checked,missions:$('#f_missions').value};
    const err=validateCfg(c); if(err){ $('#setupErr').textContent=err; return }
    pendingCfg={...c,...extra};
    newGame(c,Math.floor(Math.random()*SEED_RANGE),extra); Sound.chime(); go('code');
  },
  teacherPeek(){ go('peek') },
  confirmHome(){
    const inGame = S.screen==='game' && G && G.started;
    const msg = inGame
      ? '진행 중인 게임을 종료하고 처음 화면으로 돌아갈까요?\n지금까지의 진행 상황(생존 여부, 라운드 등)은 모두 사라집니다.'
      : '처음 화면으로 돌아갈까요?';
    if(confirm(msg))go('home');
  },
  confirmChangeSetup(){
    const ok=confirm('설정을 바꾸면 새 코드가 만들어지고, 방금 학생들이 확인한 역할은 모두 무효가 됩니다.\n아직 아무도 코드를 입력하지 않았을 때만 계속하세요.\n\n계속할까요?');
    if(ok)go('setup');
  },
  peekBack(){ go(G.started?'game':'code') },
  startGame(){ Sound.gong(); G.started=true; G.phase='d_intro'; G.timeLeft=G.cfg.disc; G.timerOn=true; go('game'); startClock() },
  useCode(){
    const dec=decodeCode($('#codeIn').value);
    if(dec.error){
      const msgs={length:'코드는 7자리예요. 글자 수를 확인하세요.',chars:'코드에 쓸 수 없는 문자가 있어요. 화면에 보이는 대로 다시 입력하세요.',checksum:'코드에 오타가 있는 것 같아요. 한 글자씩 다시 확인하세요.',range:'코드가 손상된 것 같아요. 선생님께 코드를 다시 요청하세요.'};
      $('#codeErr').textContent=msgs[dec.error]||'코드가 올바르지 않아요.'; Sound.sting(); return;
    }
    R={cfg:dec.cfg,roles:assignRoles(dec.cfg,dec.seed),idx:0,shown:false,seen:false}; Sound.chime(); go('reveal');
  },
  holdReveal(){},
  revealNext(){ Sound.click(); R.idx++; R.shown=false; R.seen=false; go('reveal') },
  revealPrev(){ Sound.click(); R.idx--; R.shown=false; R.seen=false; go('reveal') },
  revealRestart(){ R.idx=0; R.shown=false; R.seen=false; go('reveal') },
  pick(b){
    const i=+b.dataset.i; Sound.click();
    if(G.phase==='n_mafia')G.night.mafia=i;
    else if(G.phase==='n_doctor')G.night.doctor=i;
    else if(G.phase==='n_police'){ G.night.police=i; Sound[G.roles[i]==='mafia'?'sting':'chime']() }
    else if(G.phase==='d_vote')G.voteSel=i;
    render();
  },
  next(){
    Sound.click();
    const order=['n_sleep','n_mafia','n_doctor','n_police','dawn'];
    let k=order.indexOf(G.phase)+1;
    while(k<order.length-1){
      if(order[k]==='n_doctor'&&!aliveRole('doctor')){k++;continue}
      if(order[k]==='n_police'&&!aliveRole('police')){k++;continue}
      break;
    }
    G.phase=order[k]; go('game');
  },
  dawnReveal(){
    const t=G.night.mafia, saved=t!=null&&G.night.doctor===t;
    G.lastNight={killed:(t!=null&&!saved)?t:null,saved};
    G.phase='dawn_roll'; go('game');
    runCountdown(3,()=>{ if(G.lastNight.killed!=null){ G.alive[G.lastNight.killed]=false; Sound.sting() } else Sound.chime(); G.phase='dawn_result'; go('game') });
  },
  afterDawn(){ if(checkWin(false))return; G.phase='d_discuss'; G.timeLeft=G.cfg.disc; G.timerOn=true; go('game'); startClock() },
  toNight(){ Sound.click(); G.timerOn=false; startRound() },
  toMission(){ Sound.click(); G.timerOn=false; G.phase='d_mission'; go('game') },
  missionOk(){ Sound.click(); ACT.toVote() },
  missionFail(){ Sound.sting(); G.phase='d_missionfail'; go('game') },
  timerToggle(){ G.timerOn=!G.timerOn; if(G.timeLeft<=0){G.timeLeft=G.phase==='d_vote'?G.cfg.vote:G.cfg.disc} const b=$('#tbtn'); if(b)b.textContent=G.timerOn?'일시정지':'시작' },
  timerPlus(){ G.timeLeft+=30; const el=$('#clock'); if(el){el.textContent=fmt(G.timeLeft); el.classList.remove('warn')} },
  toVote(){ Sound.gong(); G.phase='d_vote'; G.timeLeft=G.cfg.vote; G.timerOn=true; G.voteSel=null; go('game'); startClock() },
  noExec(){ G.timerOn=false; G.phase='no_exec'; go('game') },
  execute(){ G.timerOn=false; G.phase='exec_roll'; go('game'); runCountdown(3,()=>{ G.lastExec=G.voteSel; G.alive[G.voteSel]=false; Sound[G.roles[G.voteSel]==='mafia'?'fanfare':'bad'](); G.phase='exec_result'; go('game') }) },
  afterExec(){ if(checkWin(true))return; G.round++; startRound() },
  again(){ const c=G.cfg; newGame({n:c.n,m:c.m,p:c.p,d:c.d,r:c.r},Math.floor(Math.random()*SEED_RANGE),{disc:c.disc,vote:c.vote,showRole:c.showRole,majority:c.majority,missions:G.missions.join('\n')}); Sound.chime(); go('code') }
};

/* hold-to-reveal on 디벗 */
document.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.hidden-card'); if(!card||S.screen!=='reveal')return;
  e.preventDefault(); R.shown=true; R.seen=true; Sound.click(); render();
});
document.addEventListener('pointerup',()=>{ if(S.screen==='reveal'&&R&&R.shown){ R.shown=false; render() } });
document.addEventListener('pointercancel',()=>{ if(S.screen==='reveal'&&R&&R.shown){ R.shown=false; render() } });
document.addEventListener('keydown',e=>{
  if(S.screen==='reveal'&&(e.key===' '||e.key==='Enter')&&!R.shown&&R.idx<R.cfg.n){ e.preventDefault(); R.shown=true; R.seen=true; render() }
  if(S.screen==='enterCode'&&e.key==='Enter')ACT.useCode();
});
document.addEventListener('keyup',e=>{ if(S.screen==='reveal'&&(e.key===' '||e.key==='Enter')&&R.shown){ R.shown=false; render() } });
window.addEventListener('beforeunload',e=>{ if(G&&S.screen==='game'){ e.preventDefault(); e.returnValue='' } });

render();
</script>
</body>
